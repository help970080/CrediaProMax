<!DOCTYPE html>
<html lang="es-MX">
<head>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#173f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CobraPro">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CobraPro · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eaeef3;--surf:#ffffff;--surf-1:#ffffff;--surf-2:#f4f7fa;--surf-3:#e7ecf3;--line:#dbe2ea;--line-2:#c3ccd8;
    --txt:#1c2530;--ink:#1c2530;--dim:#586474;--faint:#8e9aa9;--acc:#2d7d8f;--acc-d:#1d5f70;--grn:#178a55;--red:#c8452f;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:
    radial-gradient(1100px 560px at 82% -8%,rgba(45,125,143,.10),transparent 60%),
    radial-gradient(820px 460px at -8% 108%,rgba(90,130,175,.08),transparent 55%),var(--bg);
    color:var(--txt);font-family:"Sora",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .mono{font-family:"IBM Plex Mono",monospace}
  .card{width:372px;max-width:100%;background:var(--surf);border:1px solid var(--line);border-radius:18px;
    padding:30px 28px 28px;box-shadow:0 18px 44px rgba(28,37,48,.13)}
  .brand{display:flex;align-items:center;gap:13px;margin-bottom:5px}
  .brand img{width:52px;height:52px;display:block;flex:none}
  .brand h1{font-size:1.5rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
  .tag{color:var(--faint);font-size:.82rem;margin:0 0 24px 65px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.74rem;color:var(--dim);margin-bottom:6px}
  .field input{width:100%;background:var(--surf-2);border:1px solid var(--line-2);color:var(--txt);font-family:"Sora";font-size:.95rem;padding:12px 13px;border-radius:9px;outline:none;transition:border-color .13s,background .13s}
  .field input:focus{border-color:var(--acc);background:var(--surf)}
  .enter{width:100%;background:var(--acc);color:#fff;border:none;border-radius:10px;font-family:"Sora";font-weight:700;font-size:.98rem;padding:13px;cursor:pointer;margin-top:6px;transition:background .13s}
  .enter:hover{background:var(--acc-d)}
  .enter:focus-visible{outline:2px solid var(--acc-d);outline-offset:2px}
  .enter:disabled{opacity:.6;cursor:default}
  .err{color:var(--red);font-size:.82rem;margin-top:12px;text-align:center;min-height:18px}
  .hint{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:.74rem;color:var(--faint);text-align:center;line-height:1.6}
  .hint b{color:var(--dim)}
  @media (max-width:420px){ .card{padding:26px 22px 24px} .brand img{width:46px;height:46px} .tag{margin-left:59px} }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/logo.svg" alt="" width="52" height="52"><h1>CobraPro</h1></div>
    <div class="tag">Crédito y cobranza · inicia sesión</div>
    <div class="field"><label>Usuario</label><input id="u" autocomplete="username" autofocus></div>
    <div class="field"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()"></div>
    <button class="enter" id="btn" onclick="entrar()">Entrar</button>
    <div class="err" id="err"></div>
    <div class="hint">Cada usuario entra a su panel según su rol.</div>
  </div>
<script>
  const dest = { admin:'cobrapro.html', supervisor:'cobrapro.html', sucursal:'cobrapro_sucursal.html', cobrador:'cobrapro_campo.html', promotor_grupal:'grupal_campo.html', jc:'cobrapro_jc.html', super:'super.html' };
  async function entrar(){
    const err = document.getElementById('err'); const btn = document.getElementById('btn');
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando…';
    try{
      const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ usuario: document.getElementById('u').value.trim(), password: document.getElementById('p').value }) });
      const d = await r.json();
      if(!r.ok) throw new Error(d.error || 'No se pudo iniciar sesión');
      try{ localStorage.setItem('cobrapro_token', d.token); localStorage.setItem('cobrapro_user', JSON.stringify(d.user)); localStorage.setItem('cobrapro_brand', JSON.stringify(d.brand||{nombre:'CobraPro'})); }catch(e){}
      if(d.super){ location.href='super.html'; return; }
      location.href = dest[d.user.rol] || 'cobrapro.html';
    }catch(e){
      err.textContent = e.message; btn.disabled = false; btn.textContent = 'Entrar';
    }
  }
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
</html>
