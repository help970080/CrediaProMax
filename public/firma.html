<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Firma tu contrato</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1b2420;--paper:#f4f3ef;--surf:#fff;--line:#dcdbd3;--gold:#b8860b;--grn:#3b6e4a;--red:#a63a2b;--dim:#6e7369}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Sora',system-ui,sans-serif;font-size:15px;line-height:1.55}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
  .brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 16px;line-height:1.2}
  .card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .row b{font-weight:600;text-align:right}
  .big{font-size:26px;font-weight:800;color:var(--gold)}
  .legal{font-size:12.5px;color:var(--dim);line-height:1.6;max-height:210px;overflow:auto;
         border:1px solid var(--line);border-radius:9px;padding:12px;background:#fbfaf7}
  .paso{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .paso .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;
           display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:600}
  .paso.ok .n{background:var(--grn)}
  .paso .t{font-weight:600;font-size:14px}
  label.foto{display:block;border:2px dashed var(--line);border-radius:10px;padding:20px 12px;text-align:center;
             color:var(--dim);font-size:13.5px;cursor:pointer;margin-bottom:12px;background:#fbfaf7}
  label.foto.lista{border-style:solid;border-color:var(--grn);color:var(--grn);background:#f0f7f1;padding:8px}
  label.foto img{max-width:100%;border-radius:7px;display:block;margin:0 auto}
  input[type=file]{display:none}
  #firma{width:100%;height:170px;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
  .btn{width:100%;padding:15px;border-radius:11px;border:0;font-family:'Sora';font-size:16px;font-weight:700;cursor:pointer}
  .btn.g{background:var(--gold);color:#fff}
  .btn.g:disabled{background:#ccc;color:#888}
  .btn.min{background:transparent;color:var(--dim);font-size:13px;font-weight:400;padding:9px}
  .chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:13.5px}
  .chk input{width:20px;height:20px;flex:0 0 auto;margin-top:1px}
  .msg{padding:13px;border-radius:10px;font-size:14px;margin-bottom:14px}
  .msg.err{background:#fbeae7;color:var(--red);border:1px solid #f0c6bf}
  .msg.ok{background:#eef6ef;color:var(--grn);border:1px solid #c6ddca}
  .cen{text-align:center;padding:40px 16px}
  .cen .ico{font-size:44px;margin-bottom:10px}
  .pie{font-size:11.5px;color:var(--dim);text-align:center;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="cen"><div class="ico">⏳</div>Cargando tu contrato…</div>
</div>

<script>
const T = new URLSearchParams(location.search).get('t') || '';
const app = document.getElementById('app');
const fmt = n => '$' + Math.round(n||0).toLocaleString('es-MX');
const fotos = { ineFrente:null, ineReverso:null, selfie:null };
let doc = null, firmaVacia = true;

function pantalla(html){ app.innerHTML = html; }
function err(m){ return '<div class="msg err">'+m+'</div>'; }

async function cargar(){
  if(!T) return pantalla('<div class="cen"><div class="ico">🔗</div><b>Link incompleto</b><p>Pide que te lo reenvíen.</p></div>');
  try{
    const r = await fetch('/api/firma/'+encodeURIComponent(T));
    const d = await r.json();
    if(!r.ok) return pantalla('<div class="cen"><div class="ico">⚠️</div><b>'+(d.error||'No se pudo abrir')+'</b></div>');
    if(d.yaFirmado) return pantalla('<div class="cen"><div class="ico">✅</div><b>Ya está firmado</b><p>Recibimos tu contrato el '+(d.fecha||'')+'. No necesitas hacer nada más.</p></div>');
    doc = d.doc; render();
  }catch(e){ pantalla('<div class="cen"><div class="ico">📶</div><b>Sin conexión</b><p>Revisa tu internet e intenta otra vez.</p></div>'); }
}

function render(){
  const d = doc;
  pantalla(`
    <div class="brand">${d.acreedor}</div>
    <h1>Revisa y firma tu contrato</h1>

    <div class="card">
      <h2>Tu crédito · ${d.folio}</h2>
      <div class="row"><span>Recibes</span><b class="big">${fmt(d.entregaMonto)}</b></div>
      <div class="row"><span>Pagos ${d.freq}</span><b>${d.pagos} de ${fmt(d.cuota)}</b></div>
      <div class="row"><span>Total a pagar</span><b>${fmt(d.total)}</b></div>
      ${d.primerPago ? `<div class="row"><span>Primer pago descontado</span><b>${fmt(d.primerPago)}</b></div>` : ''}
      <div class="row"><span>A nombre de</span><b>${d.cliente.nombre}</b></div>
    </div>

    <div class="card">
      <h2>Contrato y pagaré</h2>
      <div class="legal">
        <b>PAGARÉ</b><br>
        Por este pagaré debo y pagaré incondicionalmente a la orden de <b>${d.acreedor}</b>,
        en ${d.lugar || 'la plaza de cobro'}, la cantidad de <b>${fmt(d.total)}</b>
        (${d.pagos} pagos ${d.freq} de ${fmt(d.cuota)} cada uno).<br><br>
        Suscribe: <b>${d.cliente.nombre}</b>, con domicilio en ${d.cliente.domicilio}.
        ${d.cliente.curp ? 'CURP: '+d.cliente.curp+'.' : ''}<br><br>
        <b>CONDICIONES</b><br>
        1. El pago se realiza de forma ${d.freq==='diarios'?'diaria':'semanal'} en el domicilio del suscriptor o en sucursal.<br>
        2. La falta de pago de una parcialidad no releva del pago de las restantes.<br>
        3. El suscriptor autoriza a ${d.acreedor} a consultar y reportar su comportamiento de pago ante sociedades de información crediticia.<br>
        4. El suscriptor manifiesta que los datos y documentos que entrega son verdaderos y propios.<br>
        5. Los datos personales se tratan conforme al aviso de privacidad de ${d.acreedor}, únicamente para la administración de este crédito.<br><br>
        <b>FIRMA ELECTRÓNICA</b><br>
        Al firmar en este dispositivo, el suscriptor acepta el contenido de este documento. Se registran la fecha, la hora,
        la dirección IP y el dispositivo desde el que se firma, junto con una huella digital del documento aceptado.
      </div>
    </div>

    <div class="card">
      <h2>Tu identificación</h2>
      ${['ineFrente','ineReverso','selfie'].map((k,i)=>{
        const t = ['Frente de tu INE','Reverso de tu INE','Foto tuya sosteniendo tu INE'][i];
        return `<div class="paso" id="p-${k}"><div class="n">${i+1}</div><div class="t">${t}</div></div>
        <label class="foto" id="l-${k}"><span>Toca para tomar la foto</span>
          <input type="file" accept="image/*" capture="environment" onchange="subir('${k}',this)"></label>`;
      }).join('')}
    </div>

    <div class="card">
      <h2>Tu firma</h2>
      <p style="font-size:13px;color:var(--dim);margin:0 0 10px">Firma con el dedo dentro del recuadro.</p>
      <canvas id="firma"></canvas>
      <button class="btn min" onclick="limpiar()">Borrar y firmar otra vez</button>
    </div>

    <label class="chk">
      <input type="checkbox" id="acepto" onchange="revisar()">
      <span>Leí el contrato y el pagaré, estoy de acuerdo y firmo por mi propia voluntad.</span>
    </label>

    <div id="aviso"></div>
    <button class="btn g" id="enviar" disabled onclick="enviar()">Firmar mi contrato</button>
    <div class="pie">Este link es personal.<br>Si algo no coincide con lo que te dijeron, no firmes y avisa a tu asesor.</div>
  `);
  iniciarFirma();
}

/* ---- fotos: se comprimen en el teléfono para que suban rápido ---- */
function subir(k, input){
  const f = input.files && input.files[0]; if(!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 1100, esc = Math.min(1, max/Math.max(img.width,img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width*esc); cv.height = Math.round(img.height*esc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    fotos[k] = cv.toDataURL('image/jpeg', 0.72);
    const l = document.getElementById('l-'+k);
    l.classList.add('lista');
    l.innerHTML = '<img src="'+fotos[k]+'" alt=""><input type="file" accept="image/*" capture="environment" onchange="subir(\''+k+'\',this)">';
    document.getElementById('p-'+k).classList.add('ok');
    revisar();
  };
  img.onerror = () => alert('No se pudo leer la foto, intenta otra vez.');
  img.src = URL.createObjectURL(f);
}

/* ---- firma con el dedo ---- */
function iniciarFirma(){
  const cv = document.getElementById('firma'); if(!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const g = cv.getContext('2d'); g.scale(dpr,dpr);
  g.lineWidth = 2.4; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#1b2420';
  let pinta=false;
  const pos = e => { const b=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-b.left, y:t.clientY-b.top}; };
  const ini = e => { e.preventDefault(); pinta=true; firmaVacia=false; const p=pos(e); g.beginPath(); g.moveTo(p.x,p.y); revisar(); };
  const mov = e => { if(!pinta) return; e.preventDefault(); const p=pos(e); g.lineTo(p.x,p.y); g.stroke(); };
  const fin = () => { pinta=false; };
  ['mousedown','touchstart'].forEach(ev=>cv.addEventListener(ev,ini,{passive:false}));
  ['mousemove','touchmove'].forEach(ev=>cv.addEventListener(ev,mov,{passive:false}));
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>cv.addEventListener(ev,fin));
}
function limpiar(){
  const cv=document.getElementById('firma'); if(!cv) return;
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height); firmaVacia=true; revisar();
}
function revisar(){
  const ok = fotos.ineFrente && fotos.ineReverso && fotos.selfie && !firmaVacia &&
             document.getElementById('acepto') && document.getElementById('acepto').checked;
  const b = document.getElementById('enviar'); if(b) b.disabled = !ok;
}

async function enviar(){
  const b = document.getElementById('enviar');
  b.disabled = true; b.textContent = 'Enviando…';
  document.getElementById('aviso').innerHTML = '';
  try{
    const r = await fetch('/api/firma/'+encodeURIComponent(T), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ ...fotos, firma: document.getElementById('firma').toDataURL('image/png'), acepto:true })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'No se pudo enviar');
    pantalla('<div class="cen"><div class="ico">✅</div><h1>Listo, quedó firmado</h1>'+
      '<p>Tu contrato <b>'+d.folio+'</b> quedó registrado. Tu asesor te va a contactar para la entrega.</p>'+
      '<p style="font-size:12px;color:var(--dim);margin-top:18px">Comprobante: '+d.hash+'</p></div>');
  }catch(e){
    document.getElementById('aviso').innerHTML = err(e.message);
    b.disabled = false; b.textContent = 'Firmar mi contrato';
  }
}

cargar();
</script>
</body>
</html>
