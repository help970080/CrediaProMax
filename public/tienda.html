<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo</title>
<!-- tienda v8 · distintivo de distribuidor autorizado -->
<meta name="theme-color" content="#141b26">
<meta name="description" content="Llévate tu equipo hoy y págalo por semana.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#141b26; --noche-2:#1d2735; --linea:#2c384a;
  --oro:#e0a922; --papel:#fff; --tinta:#141b26; --tinta-2:#5d6b7e; --tenue:#93a1b3;
  --borde:#e6eaf0; --wa:#1faa53;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Sora,system-ui,sans-serif;background:var(--noche);color:var(--papel);line-height:1.5;min-height:100vh}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}

header{padding:32px 20px 22px;max-width:1120px;margin:0 auto}
.marca{font-size:1.05rem;font-weight:700;color:var(--oro)}
/* El logotipo tiene tipografía azul marino: sobre el fondo oscuro no se leería, por eso va en una
   pastilla blanca. La imagen se manda al doble de tamaño para que no se vea borrosa en celular. */
.distribuidor{display:inline-flex;align-items:center;gap:11px;margin-top:13px;padding:8px 15px 8px 11px;background:var(--papel);border-radius:12px}
.distribuidor img{display:block;height:34px;width:auto}
.distribuidor span{font-size:.78rem;font-weight:600;color:var(--tinta);line-height:1.25;border-left:1px solid #dde3ec;padding-left:11px}
h1{font-size:clamp(1.85rem,5.6vw,2.8rem);font-weight:700;line-height:1.13;margin:13px 0 9px;max-width:16ch}
.bajada{color:#b6c2d2;font-size:.97rem;max-width:44ch}
.plazos{display:inline-flex;gap:3px;margin-top:20px;padding:4px;background:var(--noche-2);border:1px solid var(--linea);border-radius:12px;flex-wrap:wrap}
.plazos button{font-size:.87rem;font-weight:600;color:#9fb0c4;background:none;border:0;padding:9px 16px;border-radius:9px;cursor:pointer;transition:background .18s,color .18s}
.plazos button[aria-pressed="true"]{background:var(--oro);color:var(--noche)}

.cats{display:flex;gap:7px;overflow-x:auto;padding:18px 20px 4px;max-width:1120px;margin:0 auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;font-size:.83rem;font-weight:600;padding:7px 14px;border-radius:20px;border:1px solid var(--linea);background:transparent;color:#9fb0c4;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--papel);color:var(--noche);border-color:var(--papel)}

/* Barra de búsqueda y orden */
.barra{max-width:1120px;margin:0 auto;padding:14px 20px 0;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.buscar{flex:1 1 230px;max-width:400px;display:flex;align-items:center;gap:8px;background:var(--noche-2);border:1px solid var(--linea);border-radius:11px;padding:0 12px}
.barra .solo{margin-left:auto}
.buscar span{opacity:.55;font-size:.9rem}
.buscar input{flex:1;min-width:0;background:none;border:0;color:var(--papel);font-family:inherit;font-size:.92rem;padding:11px 0;outline:none}
.buscar input::placeholder{color:#7f8fa4}
.buscar input::-webkit-search-cancel-button{display:none}
.buscar button{background:none;border:0;color:#8ea0b6;font-size:.85rem;cursor:pointer;padding:4px 2px}
.barra select{background:var(--noche-2);border:1px solid var(--linea);color:#cdd8e6;font-family:inherit;font-size:.86rem;padding:11px 12px;border-radius:11px;cursor:pointer}
.solo{display:flex;align-items:center;gap:7px;font-size:.85rem;color:#a9b8ca;cursor:pointer;white-space:nowrap}
.solo input{width:17px;height:17px;accent-color:var(--oro)}
.conteo{max-width:1120px;margin:0 auto;padding:12px 20px 0;font-size:.8rem;color:#7f8fa4}
.limpiar{background:none;border:1px solid var(--linea);color:#b6c2d2;font-family:inherit;font-size:.85rem;padding:9px 15px;border-radius:10px;cursor:pointer;margin-top:14px}

main{max-width:1120px;margin:0 auto;padding:14px 20px 70px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.equipo{background:var(--papel);color:var(--tinta);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;width:100%}
.equipo .cuerpo{background:none;border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.retrato{aspect-ratio:1;background:#eef1f6;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.retrato img{width:100%;height:100%;object-fit:contain;padding:12px}
.sin-foto{font-size:2.4rem;opacity:.2}
.sello{position:absolute;top:9px;right:9px;background:rgba(20,27,38,.82);color:#fff;font-size:.66rem;font-weight:600;padding:3px 9px;border-radius:20px}
/* La miniatura de YouTube trae franjas negras: se recorta para que llene la tarjeta */
.retrato img.del-video,.ficha-foto img.del-video{object-fit:cover;padding:0}
.jugar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:0;background:rgba(20,27,38,.82);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.15rem;padding-left:4px;cursor:pointer}
.jugar:active{background:rgba(20,27,38,.95)}
.retrato.sonando{background:#000}
.retrato iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.parar{position:absolute;top:7px;right:7px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(20,27,38,.72);color:#fff;font-size:.85rem;cursor:pointer}
.cuerpo{padding:14px 15px 16px;display:flex;flex-direction:column;flex:1}
.nombre{font-weight:600;font-size:.98rem;line-height:1.3}
.sub{font-size:.75rem;color:var(--tenue);margin-bottom:11px}
.pago{display:flex;align-items:baseline;gap:6px;margin-top:auto}
.pago .cifra{font-family:'IBM Plex Mono',monospace;font-size:1.95rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pago .cada{font-size:.8rem;color:var(--tinta-2)}
.pie-tarjeta{font-size:.76rem;color:var(--tinta-2);margin-top:5px}
.pedido{display:inline-block;font-size:.7rem;font-weight:600;color:#8a5a1f;background:#fdf0d8;padding:3px 9px;border-radius:20px;margin-bottom:8px;align-self:flex-start}

.aviso{padding:44px 4px;color:#93a1b3;font-size:.95rem;max-width:46ch}
footer{max-width:1120px;margin:0 auto;padding:0 20px 46px;color:#6d7d92;font-size:.78rem;line-height:1.6}

.velo{position:fixed;inset:0;background:rgba(10,15,25,.72);z-index:60;display:none;align-items:flex-end;justify-content:center}
.velo.abierto{display:flex}
.ficha{background:var(--papel);color:var(--tinta);width:100%;max-width:560px;max-height:93vh;overflow-y:auto;border-radius:20px 20px 0 0}
@media(min-width:640px){.velo{align-items:center}.ficha{border-radius:20px}}
.ficha-foto{aspect-ratio:4/3;background:#eef1f6;display:flex;align-items:center;justify-content:center;position:relative}
.ficha-foto img{width:100%;height:100%;object-fit:contain;padding:16px}
.cerrar{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.94);font-size:1rem;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.14)}
.tiras{display:flex;gap:7px;padding:11px 18px 0;overflow-x:auto}
.tiras img{width:54px;height:54px;object-fit:contain;background:#eef1f6;border-radius:9px;border:2px solid transparent;cursor:pointer;flex:0 0 auto;padding:3px}
.tiras img[aria-current="true"]{border-color:var(--oro)}
.ficha-cuerpo{padding:16px 18px 22px}
.ficha-cuerpo h2{font-size:1.24rem;font-weight:700;line-height:1.25}
.ficha-cat{font-size:.75rem;color:var(--tinta-2);margin-bottom:10px}
.ficha-desc{font-size:.9rem;color:var(--tinta-2);line-height:1.55;margin:11px 0}
.video{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;margin:13px 0;background:#000}
/* Video como encabezado de la ficha: pegado al borde, sin margen ni esquinas redondas abajo */
.ficha-video{position:relative;background:#000}
.ficha-video .video{margin:0;border-radius:20px 20px 0 0}
@media(min-width:640px){.ficha-video .video{border-radius:20px 20px 0 0}}
.ficha-video .cerrar{z-index:3}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.precios{background:#f5f7fa;border-radius:14px;padding:16px;margin:14px 0}
.precios .grande{font-family:'IBM Plex Mono',monospace;font-size:1.85rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.precios .grande span{font-family:Sora,sans-serif;font-size:.82rem;font-weight:400;color:var(--tinta-2)}
.renglon{display:flex;justify-content:space-between;font-size:.87rem;color:var(--tinta-2);padding:7px 0 0;border-top:1px solid var(--borde);margin-top:9px}
.renglon b{color:var(--tinta);font-family:'IBM Plex Mono',monospace}
.wa{display:block;background:var(--wa);color:#fff;text-align:center;text-decoration:none;font-weight:600;font-size:.97rem;padding:14px;border-radius:12px;margin-top:6px}
/* ---- Celular: la mayoría entra desde el teléfono ---- */
@media(max-width:560px){
  header{padding:16px 14px 10px}
  .marca{font-size:.95rem}
  .distribuidor{margin-top:10px;padding:6px 12px 6px 9px;gap:9px}
  .distribuidor img{height:27px}
  .distribuidor span{font-size:.71rem;padding-left:9px}
  h1{font-size:1.32rem;margin:6px 0 4px;max-width:none}
  .bajada{font-size:.83rem}
  /* Con dos plazos caben repartidos a la mitad: nada de barra deslizable */
  .plazos{margin-top:11px;display:flex;width:100%;padding:3px}
  .plazos button{flex:1;padding:9px 6px;font-size:.84rem;text-align:center}
  .cats{padding:11px 14px 2px}
  .barra{padding:10px 14px 0;gap:7px}
  .buscar{flex:1 1 100%;max-width:none;padding:0 11px}
  .buscar input{font-size:.88rem;padding:10px 0}
  .barra select{flex:1;min-width:0;font-size:.81rem;padding:9px 8px}
  .barra .solo{margin-left:0;font-size:.79rem}
  .conteo{padding:9px 14px 0;font-size:.75rem}
  main{padding:10px 15px 54px}
  .rejilla{grid-template-columns:repeat(2,1fr);gap:11px}
  .cuerpo{padding:11px 11px 13px}
  .nombre{font-size:.9rem}
  .sub{font-size:.71rem;margin-bottom:8px}
  .pago .cifra{font-size:1.5rem}
  .pago .cada{font-size:.7rem}
  .pie-tarjeta{font-size:.69rem}
  .jugar{width:46px;height:46px;font-size:1rem}
  .ficha-cuerpo{padding:14px 15px 20px}
  .precios{padding:14px}
  .precios .grande{font-size:1.6rem}
  footer{padding:0 15px 34px}
}
@media(max-width:340px){.rejilla{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

</header>
<nav class="cats" id="cats" aria-label="Categorías"></nav>
<div class="barra">
  <div class="buscar">
    <span aria-hidden="true">🔎</span>
    <input id="q" type="search" placeholder="Buscar marca o modelo…" autocomplete="off" aria-label="Buscar en el catálogo">
    <button type="button" id="q-x" aria-label="Limpiar búsqueda" hidden>✕</button>
  </div>
  <select id="orden" aria-label="Ordenar">
    <option value="rec">Recomendados</option>

  </select>

</div>

<footer id="pie"></footer>

<div class="velo" id="velo" role="dialog" aria-modal="true"><div class="ficha" id="ficha"></div></div>

<script>
const AG = new URLSearchParams(location.search).get('a');
const $ = i => document.getElementById(i);
const pesos = n => '$' + Math.round(n || 0).toLocaleString('es-MX');
const esc = s => String(s == null ? '' : s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
/* Plazos que se le muestran al cliente. El servidor cotiza los cuatro que tiene configurada la
   agencia; aquí se acota a los dos que se venden. Para volver a mostrar 21 o 31, agrégalos aquí. */
const PLAZOS_VISIBLES = ['s16', 's17'];
let D = null, PLAN = null, CAT = '', Q = '', ORDEN = 'rec', SOLO = false;
/* Sin acentos y en minúsculas: quien busca "camara" debe encontrar "cámara". */
const plano = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

const fotoUrl = (p, n) => '/api/publico/foto/' + encodeURIComponent(AG) + '/' + p.id + '?v=' + (p.fotoV || 0) + (n ? '&n=' + n : '');

/* YouTube regala una miniatura por cada video. Si el equipo no tiene foto pero sí video, esa
   miniatura sirve de portada: mejor eso que un cuadro vacío. Vimeo no la da por dirección fija. */
function idYT(u){
  const m = String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
  return m ? m[1] : '';
}
function miniVideo(u){ const id = idYT(u); return id ? 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg' : ''; }

/* Si una foto no carga (liga rota o borrada) se intenta primero la miniatura del video y solo
   entonces se cae al ícono. Sin este escalón, un equipo con foto rota y video se quedaba con el
   ícono de paquete aunque hubiera una miniatura perfectamente buena que mostrar. */
function fotoCaida(el){
  const c = el.parentElement; if(!c) return;
  const mini = el.dataset.mini || '';
  if(mini && el.src.indexOf('img.youtube.com') < 0){
    el.classList.add('del-video'); el.dataset.mini = ''; el.src = mini; return;
  }
  el.remove();
  if(!c.querySelector('.sin-foto')) c.insertAdjacentHTML('afterbegin','<span class="sin-foto" aria-hidden="true">📦</span>');
}

function video(u){
  if(!u) return '';
  let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
  if(m) return '<div class="video"><iframe src="https://www.youtube.com/embed/' + m[1] + '" allow="accelerometer;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen title="Video del equipo"></iframe></div>';
  m = u.match(/vimeo\.com\/(\d+)/);
  if(m) return '<div class="video"><iframe src="https://player.vimeo.com/video/' + m[1] + '" allowfullscreen title="Video del equipo"></iframe></div>';
  if(/\.(mp4|webm|mov)(\?|$)/i.test(u)) return '<div class="video"><video src="' + esc(u) + '" controls playsinline></video></div>';
  return '';
}

async function cargar(){
  if(!AG){ $('aviso').textContent = 'Falta el identificador de la agencia en la dirección.'; return; }
  try{
    const r = await fetch('/api/publico/catalogo/' + encodeURIComponent(AG));
    if(!r.ok) throw 0;
    D = await r.json();
  }catch(e){
    $('aviso').textContent = 'El catálogo no está disponible en este momento. Vuelve a intentarlo más tarde.';
    return;
  }
  document.title = D.agencia;
  $('marca').textContent = D.agencia;
  const vis = D.planes.filter(p => PLAZOS_VISIBLES.includes(p.tipo));
  D.planes = vis.length ? vis : D.planes;
  PLAN = (D.planes[0] || {}).tipo;
  $('plazos').innerHTML = D.planes.map(p => '<button type="button" data-t="' + p.tipo + '" aria-pressed="' + (p.tipo===PLAN) + '">' + esc(p.label) + '</button>').join('');
  $('plazos').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    PLAN = b.dataset.t;
    [...$('plazos').children].forEach(x => x.setAttribute('aria-pressed', x.dataset.t === PLAN));
    pintar(); };
  if((D.categorias || []).length > 1){
    $('cats').innerHTML = ['<button type="button" data-c="" aria-pressed="true">Todo</button>']
      .concat(D.categorias.map(c => '<button type="button" data-c="' + esc(c) + '" aria-pressed="false">' + esc(c) + '</button>')).join('');
    $('cats').onclick = e => { const b = e.target.closest('button'); if(!b) return;
      CAT = b.dataset.c;
      [...$('cats').children].forEach(x => x.setAttribute('aria-pressed', x.dataset.c === CAT));
      pintar(); };
  }
  D.productos.forEach((p, i) => { p._orden = i; });
  $('q').oninput = e => { Q = e.target.value.trim(); $('q-x').hidden = !Q; pintar(); };
  $('q-x').onclick = () => { Q = ''; $('q').value = ''; $('q-x').hidden = true; $('q').focus(); pintar(); };
  $('orden').onchange = e => { ORDEN = e.target.value; pintar(); };
  $('solo-disp').onchange = e => { SOLO = e.target.checked; pintar(); };
  const tel = String(D.whatsapp || D.telefono || '').replace(/\D/g,'');
  $('pie').textContent = (tel
    ? 'Precios sujetos a disponibilidad. Para apartar tu equipo comunícate al ' + tel + '. '
    : 'Precios sujetos a disponibilidad y a cambio sin previo aviso. ')
    + 'Distribuidor autorizado Red Potencia.';
  pintar();
}

function portada(p){
  const mv = miniVideo(p.videoUrl);
  if(p.tieneFoto) return '<img src="' + fotoUrl(p,0) + '" alt="' + esc(p.etiqueta) + '" loading="lazy" data-mini="' + mv + '" onerror="fotoCaida(this)">';
  if(mv) return '<img class="del-video" src="' + mv + '" alt="' + esc(p.etiqueta) + '" loading="lazy" onerror="fotoCaida(this)">';
  return '<span class="sin-foto" aria-hidden="true">📦</span>';
}
function limpiarTodo(){
  Q = ''; CAT = ''; SOLO = false; ORDEN = 'rec';
  $('q').value = ''; $('q-x').hidden = true; $('solo-disp').checked = false; $('orden').value = 'rec';
  [...$('cats').children].forEach(x => x.setAttribute('aria-pressed', x.dataset.c === ''));
  pintar();
}
function pintar(){
  const q = plano(Q);
  let lista = D.productos.filter(p =>
    (!CAT || p.categoria === CAT) &&
    (!SOLO || p.disponible) &&
    (!q || plano([p.marca, p.modelo, p.categoria, p.descripcion].join(' ')).includes(q)));
  const pago = p => (p.precios[PLAN] || {}).pago || 0;
  if(ORDEN === 'barato') lista.sort((a,b) => pago(a) - pago(b));
  else if(ORDEN === 'caro') lista.sort((a,b) => pago(b) - pago(a));
  else if(ORDEN === 'nuevo') lista.sort((a,b) => b._orden - a._orden);
  else if(ORDEN === 'az') lista.sort((a,b) => (a.modelo || a.etiqueta).localeCompare(b.modelo || b.etiqueta, 'es'));
  /* Recomendados: lo que se puede llevar hoy va primero, y dentro de eso lo más barato por semana. */
  else lista.sort((a,b) => (b.disponible - a.disponible) || (pago(a) - pago(b)));
  const orden = ORDEN === 'rec' ? lista : lista.filter(p => p.disponible).concat(lista.filter(p => !p.disponible));
  const n = orden.length;
  $('conteo').textContent = n ? (n === 1 ? '1 equipo' : n + ' equipos') : '';
  if(!n){
    $('rejilla').innerHTML = '';
    $('aviso').style.display = '';
    $('aviso').innerHTML = (Q ? 'No encontramos nada con “' + esc(Q) + '”.' : 'Todavía no hay equipos aquí.')
      + '<br><button type="button" class="limpiar" onclick="limpiarTodo()">Ver todo el catálogo</button>';
    return;
  }
  $('aviso').style.display = 'none';
  $('rejilla').innerHTML = orden.map(p => {
    const c = p.precios[PLAN]; if(!c) return '';
    const id = idYT(p.videoUrl);
    return '<article class="equipo">'
      + '<div class="retrato" id="ret-' + p.id + '" onclick="abrir(' + p.id + ')">' + portada(p)
      + (id ? '<button type="button" class="jugar" aria-label="Reproducir video de ' + esc(p.etiqueta) + '" onclick="reproducir(event,' + p.id + ')">▶</button>' : '')
      + '</div>'
      + '<button type="button" class="cuerpo" onclick="abrir(' + p.id + ')">'
      + (p.disponible ? '' : '<span class="pedido">Sobre pedido</span>')
      + '<div class="nombre">' + esc(p.modelo || p.etiqueta) + '</div>'
      + '<div class="sub">' + esc(p.marca || p.categoria) + '</div>'
      + '<div class="pago"><span class="cifra">' + pesos(c.pago) + '</span><span class="cada">a la semana</span></div>'
      + '<div class="pie-tarjeta">' + c.pagos + ' pagos · enganche ' + pesos(c.enganche) + '</div>'
      + '</button></article>';
  }).join('');
}

/* Reproduce sin salir de la lista, encima de la misma miniatura. playsinline evita que iOS se
   lo lleve a pantalla completa; solo puede sonar un video a la vez. */
function reproducir(ev, pid){
  ev.stopPropagation();
  const p = D.productos.find(x => x.id === pid); if(!p) return;
  const vid = idYT(p.videoUrl); if(!vid) return;
  document.querySelectorAll('.retrato.sonando').forEach(r => { if(r.id !== 'ret-' + pid) restaurar(r); });
  const c = document.getElementById('ret-' + pid); if(!c) return;
  c.classList.add('sonando');
  c.innerHTML = '<iframe src="https://www.youtube.com/embed/' + vid + '?autoplay=1&playsinline=1&rel=0&modestbranding=1"'
    + ' allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen title="Video de ' + esc(p.etiqueta) + '"></iframe>'
    + '<button type="button" class="parar" aria-label="Cerrar video" onclick="pararVideo(event,' + pid + ')">✕</button>';
  c.onclick = null;
}
function restaurar(c){
  const pid = +c.id.replace('ret-','');
  const p = D.productos.find(x => x.id === pid); if(!p) return;
  c.classList.remove('sonando');
  c.innerHTML = portada(p) + (idYT(p.videoUrl)
    ? '<button type="button" class="jugar" aria-label="Reproducir video de ' + esc(p.etiqueta) + '" onclick="reproducir(event,' + pid + ')">▶</button>' : '');
  c.onclick = () => abrir(pid);
}
function pararVideo(ev, pid){ ev.stopPropagation(); const c = document.getElementById('ret-' + pid); if(c) restaurar(c); }

function abrir(id){
  const p = D.productos.find(x => x.id === id); if(!p) return;
  const c = p.precios[PLAN]; if(!c) return;
  const wa = String(D.whatsapp || '').replace(/\D/g,'');
  const msg = encodeURIComponent('Hola, me interesa el ' + p.etiqueta + ' que vi en el catálogo.');
  /* Con video, el video ES el encabezado. Antes se pintaba la portada arriba y el video abajo, y
     como sin foto la portada es la miniatura del mismo video, se veía dos veces lo mismo. */
  const emb = video(p.videoUrl);
  const tiras = (!emb && p.nFotos > 1)
    ? '<div class="tiras" id="tiras">' + Array.from({length:p.nFotos},(_,i) =>
        '<img src="' + fotoUrl(p,i) + '" alt="" aria-current="' + (i===0) + '" onclick="cambiar(' + p.id + ',' + i + ',this)">').join('') + '</div>'
    : '';
  const cabecera = emb
    ? '<div class="ficha-video">' + emb + '<button class="cerrar" type="button" onclick="cerrar()" aria-label="Cerrar">✕</button></div>'
    : '<div class="ficha-foto"><button class="cerrar" type="button" onclick="cerrar()" aria-label="Cerrar">✕</button>'
      + (p.tieneFoto ? '<img id="ficha-img" src="' + fotoUrl(p,0) + '" alt="' + esc(p.etiqueta) + '" onerror="fotoCaida(this)">'
         : '<span class="sin-foto" aria-hidden="true">📦</span>') + '</div>';
  $('ficha').innerHTML = cabecera + tiras
    + '<div class="ficha-cuerpo"><h2>' + esc(p.modelo || p.etiqueta) + '</h2>'
    + '<div class="ficha-cat">' + esc(p.marca ? p.marca + ' · ' + p.categoria : p.categoria) + '</div>'
    + (p.descripcion ? '<p class="ficha-desc">' + esc(p.descripcion) + '</p>' : '')
    + '<div class="precios"><div class="grande">' + pesos(c.pago) + ' <span>a la semana · ' + c.pagos + ' pagos</span></div>'
    + '<div class="renglon"><span>Enganche</span><b>' + pesos(c.enganche) + '</b></div>'
    + '<div class="renglon"><span>Precio a crédito</span><b>' + pesos(c.precio) + '</b></div></div>'
    + (p.disponible ? '' : '<p class="ficha-desc">Este equipo está sobre pedido. Pregunta por el tiempo de entrega.</p>')
    + '<a class="wa" target="_blank" rel="noopener" href="' + (wa ? 'https://wa.me/52' + wa + '?text=' + msg : 'https://wa.me/?text=' + msg) + '">Preguntar por este equipo</a></div>';
  document.querySelectorAll('.retrato.sonando').forEach(restaurar);
  $('velo').classList.add('abierto');
  document.body.style.overflow = 'hidden';
}
function cambiar(id, i, el){
  const p = D.productos.find(x => x.id === id);
  $('ficha-img').src = fotoUrl(p, i);
  [...$('tiras').children].forEach(x => x.setAttribute('aria-current', x === el));
}
function cerrar(){ $('velo').classList.remove('abierto'); document.body.style.overflow=''; }
$('velo').addEventListener('click', e => { if(e.target.id === 'velo') cerrar(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') cerrar(); });
cargar();
</script>
</body></html>
